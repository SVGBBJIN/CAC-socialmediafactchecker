<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirming your email — Trase</title>
<!-- Where a Supabase confirmation email lands (see `emailRedirectUrl` in
     public/auth-callback.js, passed as `emailRedirectTo` by `signUp` in public/auth.js).
     Before this page existed the link went to the Supabase project's Site URL — localhost
     on any project where nobody changed it — so the person who signed up on the deployed
     app clicked their email and got a dead link to their own machine.

     Styling is 404.html's, inlined for the same reason: this page has to stand on its own,
     and it is the one screen a brand-new account holder sees before the app itself. -->
<style>
  :root {
    --bg: #12151A;
    --surface: #1B1F26;
    --border: #2A2F39;
    --ink: #F0EDE6;
    --ink-dim: #A9AFBB;
    --muted: #8A93A3;
    --accent: #4FD1C5;
    --danger: #F2777A;
    --font-display: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0A0C10;
    background-image: radial-gradient(circle at 50% 0%, #171B22 0%, #0A0C10 60%);
    font-family: var(--font-body);
    display: flex; align-items: center; justify-content: center;
  }
  .wrap {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 14px; max-width: 380px; padding: 24px;
  }
  .iris-wrap { width: 72px; height: 72px; opacity: 0.75; color: var(--muted); }
  .iris-wrap svg { width: 100%; height: 100%; }
  /* Breathes while the confirmation is in flight, settles once it isn't — the same
     distinction the app's own loading iris draws between working and done. */
  .blade { transform-origin: 50px 50px; transform: rotate(var(--rot)); }
  .wrap[data-state="working"] .iris-wrap { color: var(--accent); }
  .wrap[data-state="working"] .blade { animation: blade-breathe 1.6s ease-in-out infinite; }
  .wrap[data-state="done"] .iris-wrap { color: var(--accent); }
  .wrap[data-state="failed"] .iris-wrap { color: var(--danger); }
  .blade:nth-child(1) { animation-delay: 0s; }
  .blade:nth-child(2) { animation-delay: 0.1s; }
  .blade:nth-child(3) { animation-delay: 0.2s; }
  .blade:nth-child(4) { animation-delay: 0.3s; }
  .blade:nth-child(5) { animation-delay: 0.4s; }
  .blade:nth-child(6) { animation-delay: 0.5s; }
  @keyframes blade-breathe {
    0%, 100% { transform: rotate(var(--rot)) scaleY(0.72); opacity: 0.55; }
    50% { transform: rotate(var(--rot)) scaleY(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap[data-state="working"] .blade { animation: none; }
  }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--ink); margin: 0; line-height: 1.3; }
  p { font-size: 13.5px; color: var(--ink-dim); line-height: 1.6; margin: 0; }
  a.back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 9px 16px;
    border-radius: 9px; border: 1px solid var(--accent);
    background: rgba(79,209,197,0.12); color: var(--accent);
    font-size: 13px; font-weight: 600; text-decoration: none;
    transition: background 0.15s ease;
  }
  a.back:hover { background: rgba(79,209,197,0.2); }
  a.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.back svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap" data-state="working">
    <div class="iris-wrap">
      <svg viewBox="0 0 100 100">
        <g>
          <rect class="blade" fill="currentColor" style="--rot:0deg"   x="46" y="10" width="8" height="34" rx="4"/>
          <rect class="blade" fill="currentColor" style="--rot:60deg"  x="46" y="10" width="8" height="34" rx="4"/>
          <rect class="blade" fill="currentColor" style="--rot:120deg" x="46" y="10" width="8" height="34" rx="4"/>
          <rect class="blade" fill="currentColor" style="--rot:180deg" x="46" y="10" width="8" height="34" rx="4"/>
          <rect class="blade" fill="currentColor" style="--rot:240deg" x="46" y="10" width="8" height="34" rx="4"/>
          <rect class="blade" fill="currentColor" style="--rot:300deg" x="46" y="10" width="8" height="34" rx="4"/>
        </g>
      </svg>
    </div>
    <span class="eyebrow" id="eyebrow">Confirming</span>
    <h1 id="title">Checking your link…</h1>
    <p id="message">One moment.</p>
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Trase
    </a>
  </div>
<script type="module">
  import { configure, completeEmailConfirmation } from "../auth.js";
  import { describeOutcome, readCallbackParams } from "../auth-callback.js";

  // Read before anything else: supabase-js consumes the fragment during `createClient`
  // (`detectSessionInUrl`) and rewrites the address bar, so by the time `configure`
  // resolves the tokens and the error this page has to report on are gone from the URL.
  const arrivalHref = window.location.href;

  const wrap = document.getElementById("wrap");
  const els = {
    eyebrow: document.getElementById("eyebrow"),
    title: document.getElementById("title"),
    message: document.getElementById("message"),
  };

  const EYEBROWS = { confirmed: "Welcome", expired: "Link expired", error: "Confirmation failed", bare: "Nothing to do" };

  function render(outcome) {
    wrap.dataset.state = outcome.status === "confirmed" ? "done" : "failed";
    els.eyebrow.textContent = EYEBROWS[outcome.status] || "Confirmation";
    els.title.textContent = outcome.title;
    els.message.textContent = outcome.message;
  }

  try {
    const response = await fetch("/api/config", { headers: { accept: "application/json" } });
    const config = response.ok ? await response.json() : null;
    if (!config?.supabase) {
      // Accounts are optional (see lib/supabase-config.js) — if they're off on this
      // deploy, the honest answer is that there's nothing here to confirm against, not a
      // spinner that never resolves.
      render({
        status: "error",
        title: "Accounts aren't set up here.",
        message: "This deployment has no account backend configured, so there's nothing to confirm.",
      });
    } else {
      await configure(config.supabase);
      const hasSession = await completeEmailConfirmation(arrivalHref);
      const outcome = describeOutcome(readCallbackParams(arrivalHref), { hasSession });
      render(outcome);
      // Tokens and error codes out of the address bar once they've been used — they're
      // single-use anyway, and this is a URL people paste when asking for help.
      window.history.replaceState(null, "", window.location.pathname);
      if (outcome.signedIn) setTimeout(() => window.location.replace("/"), 1600);
    }
  } catch (error) {
    console.warn("Confirmation failed:", error);
    render({
      status: "error",
      title: "That link didn't work.",
      message: "Something went wrong finishing your sign-up. Head back to Trase and try signing in.",
    });
  }
</script>
</body>
</html>
